<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ladda upp planering</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1f2328; --muted: #656d76;
    --accent: #1f6feb; --ok: #1a7f37; --err: #cf222e; --border: #d0d7de;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  #drop { background: var(--card); border: 2px dashed var(--border); border-radius: 12px;
    padding: 56px 20px; text-align: center; cursor: pointer; transition: .15s; }
  #drop.over { border-color: var(--accent); background: #eef4ff; }
  #drop.busy { opacity: .6; pointer-events: none; }
  #drop strong { display: block; font-size: 18px; margin-bottom: 6px; }
  #drop span { color: var(--muted); }
  #codeRow { margin-top: 16px; display: none; }
  #codeRow label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  #code { width: 100%; padding: 8px 10px; font-size: 15px; border: 1px solid var(--border); border-radius: 6px; }
  #msg { margin-top: 16px; min-height: 24px; font-weight: 500; }
  #msg.ok { color: var(--ok); } #msg.err { color: var(--err); }
  #preview { margin-top: 16px; width: 100%; border: 1px solid var(--border); display: none; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Verkstadsplanering</h1>
  <p class="sub">Släpp den nya PDF:en här så ersätter den planeringen. Visningssidan hämtar den automatiskt.
    <a href="./">Öppna visningssidan</a></p>

  <div id="drop">
    <strong>Dra och släpp PDF här</strong>
    <span>eller klicka för att välja fil</span>
    <input id="file" type="file" accept="application/pdf,.pdf" hidden>
  </div>

  <div id="codeRow">
    <label for="code">Uppladdningskod</label>
    <input id="code" type="password" autocomplete="off">
  </div>

  <div id="msg"></div>
  <img id="preview" alt="Förhandsvisning">
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  // ===== Inställningar =====
  const WORKER_URL = 'https://frosty-rain-8143.jespercarlson94.workers.dev';
  const USE_CODE = false;     // true om du satt UPLOAD_CODE i Workern
  const IMAGE_WIDTH = 3840;   // Bildens bredd i pixlar (3840 = skarp även på 4K-TV)

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const $ = id => document.getElementById(id);
  const drop = $('drop'), fileInput = $('file'), msg = $('msg'), codeInput = $('code'), preview = $('preview');

  if (USE_CODE) {
    $('codeRow').style.display = 'block';
    try { codeInput.value = localStorage.getItem('vp_code') || ''; } catch {}
  }

  function show(text, cls) { msg.textContent = text; msg.className = cls || ''; }

  drop.onclick = () => fileInput.click();
  fileInput.onchange = () => fileInput.files[0] && upload(fileInput.files[0]);
  ['dragenter', 'dragover'].forEach(e => drop.addEventListener(e, ev => {
    ev.preventDefault(); drop.classList.add('over');
  }));
  ['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => {
    ev.preventDefault(); drop.classList.remove('over');
  }));
  drop.addEventListener('drop', ev => {
    const f = ev.dataTransfer.files[0];
    if (f) upload(f);
  });

  // Gör om PDF:en till en PNG-bild som TV:n kan visa.
  // Vita marginaler beskärs bort och bara innehållet renderas i full upplösning.
  // Är planeringen smal (stående) delas den i två spalter så att den fyller en 16:9-TV.
  const TV_RATIO = 16 / 9;
  const GAP = 40; // mellanrum mellan spalterna (px)

  async function pdfToPng(file) {
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;

    if (pdf.numPages === 1) {
      const page = await pdf.getPage(1);
      const base = page.getViewport({ scale: 1 });
      const box = await findContentBox(page, base);
      const layout = await findRows(page, base, box);
      const ratio = ((box.x1 - box.x0) * base.width) / ((box.y1 - box.y0) * base.height);

      if (layout && shouldSplit(ratio, layout.header)) {
        const colW = Math.round((IMAGE_WIDTH - GAP) / 2);
        const full = await renderBox(page, base, box, colW);
        return toPng(splitColumns(full, layout));
      }
      return toPng(await renderBox(page, base, box, IMAGE_WIDTH));
    }

    // Flera sidor: lägg dem under varandra
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const base = page.getViewport({ scale: 1 });
      pages.push(await renderBox(page, base, await findContentBox(page, base), IMAGE_WIDTH));
    }
    const out = document.createElement('canvas');
    out.width = IMAGE_WIDTH;
    out.height = pages.reduce((h, c) => h + c.height, 0);
    const octx = out.getContext('2d');
    let y = 0;
    for (const c of pages) { octx.drawImage(c, 0, y); y += c.height; }
    return toPng(out);
  }

  function toPng(canvas) { return new Promise(r => canvas.toBlob(r, 'image/png')); }

  // Renderar området 'box' (andelar av sidan) så att det blir 'width' px brett
  async function renderBox(page, base, box, width) {
    const cropW = (box.x1 - box.x0) * base.width;
    const cropH = (box.y1 - box.y0) * base.height;
    const scale = width / cropW;
    const vp = page.getViewport({ scale });
    const c = document.createElement('canvas');
    c.width = width;
    c.height = Math.round(cropH * scale);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({
      canvasContext: ctx,
      viewport: vp,
      transform: [1, 0, 0, 1, -box.x0 * vp.width, -box.y0 * vp.height]
    }).promise;
    return c;
  }

  // Blir texten större på TV:n med två spalter? (räknat i andelar av innehållets höjd)
  function shouldSplit(ratio, header) {
    const single = Math.min(TV_RATIO / ratio, 1);
    const splitH = header + (1 - header) / 2;
    const split = Math.min(TV_RATIO / (2 * ratio), 1 / splitH);
    return split > single * 1.1;
  }

  // Letar upp rubrikens slut och var varje projekt börjar, med hjälp av PDF:ens text.
  // Allt anges som andelar (0–1) av det beskurna området. Returnerar null om strukturen inte hittas.
  async function findRows(page, base, box) {
    const items = (await page.getTextContent()).items.filter(it => it.str && it.str.trim());
    const pos = items.map(it => {
      const t = it.transform;
      const [x, y] = base.convertToViewportPoint(t[4], t[5]);
      const h = Math.hypot(t[2], t[3]) || it.height || 8;
      return { str: it.str.trim(), x, top: y - h * 0.95 };
    });
    const nr = pos.find(p => /^Projektnummer/i.test(p.str));
    const kap = pos.find(p => /^Kapacitet/i.test(p.str));
    if (!nr || !kap) return null;

    const tops = pos
      .filter(p => p.x < nr.x - 2 && p.top > kap.top + 1)
      .map(p => p.top)
      .sort((a, b) => a - b);
    if (tops.length < 4) return null;

    const y0 = box.y0 * base.height, hh = (box.y1 - box.y0) * base.height;
    const frac = y => (y - y0) / hh;
    return {
      header: frac(tops[0] - 0.5),
      starts: tops.slice(1).map(t => frac(t - 1))
    };
  }

  // Delar bilden vid den projektgräns som ger två så jämnhöga spalter som möjligt.
  // Rubriken (veckor, datum, personalbehov) upprepas överst i högra spalten.
  function splitColumns(full, layout) {
    const H = full.height, W = full.width;
    const headerPx = Math.round(layout.header * H);
    const ideal = (H + headerPx) / 2;
    let cut = Math.round(layout.starts[0] * H), best = Infinity;
    for (const f of layout.starts) {
      const y = Math.round(f * H);
      const d = Math.abs(y - ideal);
      if (d < best) { best = d; cut = y; }
    }

    const rightH = headerPx + (H - cut);
    const out = document.createElement('canvas');
    out.width = W * 2 + GAP;
    out.height = Math.max(cut, rightH);
    const ctx = out.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, out.width, out.height);

    ctx.drawImage(full, 0, 0, W, cut, 0, 0, W, cut);                          // vänster: rubrik + övre halvan
    ctx.drawImage(full, 0, 0, W, headerPx, W + GAP, 0, W, headerPx);         // höger: rubrik
    ctx.drawImage(full, 0, cut, W, H - cut, W + GAP, headerPx, W, H - cut);  // höger: nedre halvan

    ctx.fillStyle = '#c8ccd2';                                                // tunn skiljelinje
    ctx.fillRect(W + GAP / 2 - 2, 0, 4, out.height);
    return out;
  }

  // Renderar sidan litet och letar upp var innehållet finns (andelar 0–1 av sidan)
  async function findContentBox(page, base) {
    const SMALL = 1000;
    const vp = page.getViewport({ scale: SMALL / base.width });
    const c = document.createElement('canvas');
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    const d = ctx.getImageData(0, 0, c.width, c.height).data;

    let minX = c.width, minY = c.height, maxX = -1, maxY = -1;
    for (let y = 0; y < c.height; y++) {
      for (let x = 0; x < c.width; x++) {
        const i = (y * c.width + x) * 4;
        if (d[i] < 245 || d[i + 1] < 245 || d[i + 2] < 245) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return { x0: 0, y0: 0, x1: 1, y1: 1 }; // tom sida

    const pad = 6; // liten vit kant runt innehållet
    return {
      x0: Math.max(0, minX - pad) / c.width,
      y0: Math.max(0, minY - pad) / c.height,
      x1: Math.min(c.width, maxX + 1 + pad) / c.width,
      y1: Math.min(c.height, maxY + 1 + pad) / c.height
    };
  }

  async function upload(file) {
    if (!file.name.toLowerCase().endsWith('.pdf')) return show('Filen måste vara en PDF.', 'err');
    if (USE_CODE && !codeInput.value.trim()) { codeInput.focus(); return show('Fyll i uppladdningskoden.', 'err'); }

    drop.classList.add('busy');
    try {
      show('Förbereder ' + file.name + '…');
      const png = await pdfToPng(file);
      preview.src = URL.createObjectURL(png);
      preview.style.display = 'block';

      const data = new FormData();
      data.append('file', file);
      data.append('image', png, 'planering.png');
      if (USE_CODE) data.append('code', codeInput.value.trim());

      show('Laddar upp…');
      const res = await fetch(WORKER_URL, { method: 'POST', body: data });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.message || 'HTTP ' + res.status);
      if (USE_CODE) { try { localStorage.setItem('vp_code', codeInput.value.trim()); } catch {} }
      show('Klart! Planeringen syns på visningssidan inom några minuter.', 'ok');
    } catch (err) {
      console.error(err);
      show('Uppladdningen misslyckades: ' + err.message, 'err');
    } finally {
      drop.classList.remove('busy');
      fileInput.value = '';
    }
  }
</script>
</body>
</html>
