<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verkstadsplanering</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1b1d21; color: #9aa0a6;
    font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
  body.scroll { overflow: auto; }
  #plan { display: none; margin: 0 auto; background: #fff; }
  #message { padding: 60px 20px; text-align: center; font-size: 22px; }
  #status { position: fixed; right: 12px; bottom: 10px; padding: 6px 10px; border-radius: 6px;
    background: #000; background: rgba(0,0,0,.55); font-size: 14px; }
</style>
</head>
<body>
<div id="message">Laddar planering…</div>
<img id="plan" alt="Verkstadsplanering">
<div id="status"></div>

<script>
  // Skriven i gammal, enkel JavaScript så att den fungerar även i TV-webbläsare.
  // ===== Inställningar =====
  var IMG_FILE = 'planering.png';
  var CHECK_INTERVAL_MS = 30 * 1000;   // Testfas: 30 sek. Sätt till 10 * 60 * 1000 för 10 min.

  var plan = document.getElementById('plan');
  var message = document.getElementById('message');
  var statusEl = document.getElementById('status');
  var currentVersion = null;

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function now() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  function fit() {
    if (!plan.naturalWidth) return;
    var w = window.innerWidth, h = window.innerHeight;
    var ratio = plan.naturalWidth / plan.naturalHeight;
    if (w / h > ratio && plan.naturalHeight / plan.naturalWidth < 2) {
      // Anpassa till höjden (en sida får plats på skärmen)
      plan.style.height = h + 'px'; plan.style.width = Math.round(h * ratio) + 'px';
      document.body.className = '';
    } else {
      plan.style.width = w + 'px'; plan.style.height = Math.round(w / ratio) + 'px';
      document.body.className = (w / ratio > h) ? 'scroll' : '';
    }
  }

  function showImage(version) {
    var img = new Image();
    img.onload = function () {
      plan.src = img.src;
      plan.style.display = 'block';
      message.style.display = 'none';
      currentVersion = version;
      setTimeout(fit, 0);
      statusEl.innerHTML = 'Uppdaterad ' + now();
    };
    img.onerror = function () { statusEl.innerHTML = 'Kunde inte ladda bilden ' + now(); };
    img.src = IMG_FILE + '?v=' + encodeURIComponent(version);
  }

  function check() {
    var xhr = new XMLHttpRequest();
    xhr.open('HEAD', IMG_FILE + '?check=' + new Date().getTime(), true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200) {
        var version = xhr.getResponseHeader('ETag') || xhr.getResponseHeader('Last-Modified')
          || xhr.getResponseHeader('Content-Length') || String(new Date().getTime());
        if (version !== currentVersion) showImage(version);
        else statusEl.innerHTML = 'Kontrollerad ' + now();
      } else if (!currentVersion) {
        message.innerHTML = 'Ingen planering hittades ännu.<br>Ladda upp en PDF via upload.html.';
        statusEl.innerHTML = 'Kontrollerad ' + now();
      } else {
        statusEl.innerHTML = 'Kunde inte kontrollera ' + now();
      }
    };
    xhr.send();
  }

  window.onresize = fit;
  check();
  setInterval(check, CHECK_INTERVAL_MS);
</script>
</body>
</html>
